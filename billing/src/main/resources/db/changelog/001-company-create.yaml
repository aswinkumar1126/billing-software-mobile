databaseChangeLog:

  - changeSet:
      id: 001-company-create
      author: aswinkumar1126

      changes:

        - createTable:
            tableName: COMPANY

            columns:

              - column:
                  name: ID
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: COMPANY_ID
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: COMPANY_NAME
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: FLAT
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: STREET
                  type: VARCHAR(150)
                  constraints:
                    nullable: true

              - column:
                  name: CITY
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: STATE
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: COUNTRY
                  type: VARCHAR(100)
                  defaultValue: "India"
                  constraints:
                    nullable: false

              - column:
                  name: LOGO
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

              - column:
                  name: DESCRIPTION
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

              - column:
                  name: CREATED_AT
                  type: DATETIME2
                  constraints:
                    nullable: false

              - column:
                  name: UPDATED_AT
                  type: DATETIME2
                  constraints:
                    nullable: true

              - column:
                  name: PHONE
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: PINCODE
                  type: VARCHAR(10)
                  constraints:
                    nullable: false

              - column:
                  name: ACTIVE
                  type: BIT
                  defaultValueBoolean: true
                  constraints:
                    nullable: false